<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nikateliê — Simulador de Cores 3D</title>
<meta name="description" content="Veja as peças impressas em 3D da Nikateliê em cada cor de filamento antes de comprar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --nk-rosa:#E5458C; --nk-rosa-esc:#C42F72; --nk-rosa-claro:#FCE8F1;
    --nk-tinta:#3A2733; --nk-suave:#86707C; --nk-borda:#F1D6E3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--nk-tinta)}
  button{font-family:inherit}
  .nk3d{max-width:1000px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:start}
  @media (max-width:760px){ .nk3d{grid-template-columns:1fr;padding:12px;gap:16px} }

  .nk-palco{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1/1;
    background:radial-gradient(120% 90% at 50% 22%,#fff 0%,#FDF1F6 55%,#F7D9E7 100%);border:1px solid var(--nk-borda)}
  .nk-palco canvas{display:block;width:100%!important;height:100%!important;touch-action:none;cursor:grab}
  .nk-palco canvas:active{cursor:grabbing}
  .nk-selo{position:absolute;left:12px;top:12px;background:var(--nk-rosa);color:#fff;
    font:600 12px/1 'Fredoka',sans-serif;letter-spacing:.05em;padding:7px 11px;border-radius:999px}
  .nk-btns{position:absolute;right:12px;top:12px;display:flex;gap:8px}
  .nk-btns button{border:0;background:rgba(255,255,255,.92);width:38px;height:38px;border-radius:50%;
    cursor:pointer;display:grid;place-items:center;color:var(--nk-tinta);box-shadow:0 1px 4px rgba(120,40,80,.12)}
  .nk-btns button[aria-pressed="true"]{background:var(--nk-rosa);color:#fff}
  .nk-dica{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(255,255,255,.88);
    border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--nk-suave);white-space:nowrap;pointer-events:none;transition:opacity .4s}
  .nk-load{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--nk-suave);transition:opacity .3s}
  .nk-load.oculto{opacity:0;pointer-events:none}
  .nk-medida{position:absolute;left:12px;top:46px;font-size:11.5px;color:var(--nk-suave);background:rgba(255,255,255,.88);border-radius:8px;padding:4px 8px}

  .nk-painel{display:flex;flex-direction:column;gap:18px}
  .nk-painel h2{font:600 26px/1.15 'Fredoka',sans-serif;margin:2px 0 0}
  .nk-sub{margin:5px 0 0;color:var(--nk-suave);font-size:14.5px;line-height:1.45}
  .nk-rot{font:700 12px/1 'Nunito';letter-spacing:.08em;text-transform:uppercase;color:var(--nk-suave);margin-bottom:9px}

  .nk-chips{display:flex;gap:8px;flex-wrap:wrap}
  .nk-chips button{border:1.5px solid var(--nk-borda);background:#fff;border-radius:12px;padding:8px 13px;
    font-weight:600;font-size:14px;color:var(--nk-tinta);cursor:pointer;transition:.15s;display:flex;align-items:center;gap:8px}
  .nk-chips button:hover{border-color:var(--nk-rosa)}
  .nk-chips button[aria-pressed="true"]{border-color:var(--nk-rosa);background:var(--nk-rosa-claro);color:var(--nk-rosa-esc)}
  .nk-chips.modelos button[aria-pressed="true"]{background:var(--nk-rosa);color:#fff}
  .nk-chips .pt{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);flex:none}

  .nk-abas{display:flex;background:var(--nk-rosa-claro);border-radius:12px;padding:4px;gap:4px}
  .nk-abas button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--nk-suave);cursor:pointer}
  .nk-abas button[aria-selected="true"]{background:#fff;color:var(--nk-rosa-esc);box-shadow:0 1px 3px rgba(197,47,114,.15)}
  .nk-desc{font-size:13px;color:var(--nk-suave);margin:9px 2px 0;min-height:18px}

  .nk-cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px;margin-top:12px}
  .nk-cor{aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.09);transition:transform .12s}
  .nk-cor:hover{transform:scale(1.08)}
  .nk-cor[aria-checked="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--nk-rosa)}
  .nk-cor.silk{background-image:linear-gradient(135deg,rgba(255,255,255,.55),transparent 45%,rgba(0,0,0,.18))}
  .nk-cor.premium{background-image:linear-gradient(135deg,rgba(255,255,255,.28),transparent 40%)}

  .nk-resumo{background:var(--nk-rosa-claro);border-radius:16px;padding:14px 16px}
  .nk-resumo .lin{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 0}
  .nk-resumo .lin b{font-weight:700;min-width:96px}
  .nk-resumo .pt{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);flex:none}
  .nk-resumo small{display:block;color:var(--nk-suave);font-size:12.5px;margin-top:8px}
  /* modo loja: só o modelo, a cor vem da variação da página do produto */
  .nk-tag{display:none;position:absolute;left:10px;bottom:10px;right:10px;flex-wrap:wrap;gap:6px;pointer-events:none}
  .nk-tag span{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border-radius:999px;padding:5px 10px 5px 6px;font-size:12.5px;font-weight:600;color:var(--nk-tinta);box-shadow:0 1px 4px rgba(120,40,80,.12)}
  .nk-tag i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  body.modo-loja .nk3d{display:block;max-width:none;padding:0}
  body.modo-loja .nk-painel,body.modo-loja .nk-dica,body.modo-loja #btnCentro{display:none}
  body.modo-loja .nk-palco{border-radius:10px;border:0}
  body.modo-loja .nk-tag{display:flex}
  body.modo-loja .nk-selo{font-size:10.5px;padding:6px 9px}
  body.modo-loja .nk-medida{top:40px;font-size:10.5px}
  .nk-aviso{font-size:12px;color:var(--nk-suave);line-height:1.45;margin:0}
</style>
</head>

  <div class="nk-palco" id="palco">
    <span class="nk-selo">IMPRESSO EM 3D</span>
    <div class="nk-btns">
      <button id="btnGirar" aria-pressed="true" title="Girar automaticamente" aria-label="Girar automaticamente">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>

      <p class="nk-sub" id="sub"></p>

    <div id="blocoModelos">

      <div class="nk-chips modelos" id="modelos"></div>
    </div>

      <div class="nk-rot" id="rotCor">Cor</div>

      <p class="nk-desc" id="descAcab"></p>
      <div class="nk-cores" role="radiogroup" id="cores" aria-label="Cores disponíveis"></div>
    </div>

    <div class="nk-resumo" id="resumo"></div>
    <p class="nk-aviso">Cores simuladas — podem variar conforme a tela e o lote do filamento.</p>
  </div>
</div>

<script type="module">
/* =====================================================================

   Cor inicial de cada parte: "linha:Nome" (ex.: "velvet:Azul").

const CONFIG = {

  // Catálogo PLA Voolt3D (voolt3d.com.br/pla). Cores em hex são aproximações — ajuste olhando o carretel.
  acabamentos: {

    velvet: { rotulo: "Velvet", desc: "PLA Velvet — fosco aveludado, esconde as linhas de camada. Inclui tons pastel Macaron." },
    silk: { rotulo: "V-Silk", desc: "PLA V-Silk — brilho acetinado com efeito metálico." },
    duo: { rotulo: "Duo Shadow", desc: "PLA Duo Color Shadow (V-Silk) — 70% cor principal e 30% escura: a segunda cor aparece como sombra nas curvas e muda com o ângulo." },
    tri: { rotulo: "Tri Color", desc: "PLA Tri Color (V-Silk) — três cores que giram no fio: a peça muda de cor conforme o ângulo de visão e a luz." },
  },
  cores: [
    { nome: "Branco Dental", hex: "#F4F4F0", acab: "premium" },

    { nome: "Cinza Claro", hex: "#BDBDBD", acab: "premium" },
    { nome: "Vermelho", hex: "#C8102E", acab: "premium" },

    { nome: "Verde Macaron", hex: "#B5E3C4", acab: "velvet" },

    { nome: "Rose Gold", hex: "#D8A08F", acab: "silk" },

    { nome: "Dourado com Preto", hex: "#D4A93C", acab: "duo", multi: ["#D4A93C", "#2A2A2A"] },
    { nome: "Azul com Preto", hex: "#2F6DB5", acab: "duo", multi: ["#2F6DB5", "#2A2A2A"] },
    { nome: "Dourado com Ametista", hex: "#D4A93C", acab: "duo", multi: ["#D4A93C", "#8E5BB5"] },

    { nome: "Dourado / Rosa Choque / Verde", hex: "#D4A93C", acab: "tri", multi: ["#D4A93C", "#E5368A", "#2E9E5B"] },
    { nome: "Dourado / Laranja / Rosa Choque", hex: "#D4A93C", acab: "tri", multi: ["#D4A93C", "#F07A1E", "#E5368A"] },
    { nome: "Bronze / Prata / Ouro", hex: "#A5703A", acab: "tri", multi: ["#A5703A", "#C9CCD1", "#E0B43A"] },
    { nome: "Ametista / Azul Safira / Dourado", hex: "#8E5BB5", acab: "tri", multi: ["#8E5BB5", "#1F4FA8", "#D4A93C"] },
    { nome: "Azul / Laranja / Verde Neon", hex: "#2F6DB5", acab: "tri", multi: ["#2F6DB5", "#F07A1E", "#7CE03A"] },
    { nome: "Azul Safira / Dourado / Verde", hex: "#1F4FA8", acab: "tri", multi: ["#1F4FA8", "#D4A93C", "#2E9E5B"] },
  ],
  alturaCamadaMM: 0.2,
};
/* ===================================================================== */

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const sem = t => (t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const contem = (txt, termo) => (' ' + txt + ' ').includes(' ' + termo + ' ');
const corPorNome = ref => {
  const [l, n] = ref.includes(':') ? ref.split(':') : [null, ref];
  return CONFIG.cores.find(c => c.nome === n && (!l || c.acab === l)) || CONFIG.cores[0];
};

/* ---------- cena ---------- */
const palco = $('palco');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
palco.prepend(renderer.domElement);

const cena = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
cena.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const luz = new THREE.DirectionalLight(0xffffff, 1.3); luz.position.set(3, 5, 2);
cena.add(luz, new THREE.HemisphereLight(0xffffff, 0xf3c6da, 0.45));

const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
const controles = new OrbitControls(camera, renderer.domElement);
Object.assign(controles, { enableDamping: true, enablePan: false, minDistance: 1.2, maxDistance: 8, autoRotate: true, autoRotateSpeed: 1.4 });
controles.maxPolarAngle = Math.PI * 0.62;

const sombra = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(120,40,80,.32)'); grd.addColorStop(1, 'rgba(120,40,80,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; cena.add(m); return m;
})();

/* ---------- material de filamento (linhas de camada) ---------- */
// efeito de cada linha de filamento
//  premium: PLA comum — liso, brilho leve, linhas de camada visíveis
//  velvet : fosco aveludado — sem reflexo, brilho "de veludo" nas bordas, esconde as camadas
//  silk   : V-Silk — brilho perolado/metálico forte, reflexo que muda de tom, realça as camadas
const ACAB = {
  // duo / tri: V-Silk coextrudado (2 ou 3 cores no mesmo fio)
  premium: { roughness: 0.38, metalness: 0,    clearcoat: 0.3, clearcoatRoughness: 0.3,  sheen: 0,   iridescence: 0,    camadas: 0.16 },
  velvet:  { roughness: 0.92, metalness: 0,    clearcoat: 0,   clearcoatRoughness: 1,    sheen: 0.5, sheenRoughness: 0.6,  iridescence: 0, camadas: 0.05 },
  silk:    { roughness: 0.24, metalness: 0.3,  clearcoat: 1,   clearcoatRoughness: 0.06, sheen: 0,   iridescence: 0.3,  iridescenceIOR: 1.5, camadas: 0.24 },
  duo:     { roughness: 0.24, metalness: 0.3,  clearcoat: 1,   clearcoatRoughness: 0.06, sheen: 0,   iridescence: 0.3,  iridescenceIOR: 1.5, camadas: 0.24 },
  tri:     { roughness: 0.24, metalness: 0.3,  clearcoat: 1,   clearcoatRoughness: 0.06, sheen: 0,   iridescence: 0.3,  iridescenceIOR: 1.5, camadas: 0.24 },
};
function criarMaterial(eixo) {
  const m = new THREE.MeshPhysicalMaterial({ side: THREE.DoubleSide });
  const u = { uEixo: { value: eixo }, uFreq: { value: Math.PI * 2 / CONFIG.alturaCamadaMM }, uAmp: { value: 0.16 },
    uN: { value: 1 }, uC0: { value: new THREE.Color() }, uC1: { value: new THREE.Color() }, uC2: { value: new THREE.Color() },
    uCentro: { value: new THREE.Vector3() } };
  m.userData.u = u;
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, u);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform vec3 uEixo; varying float vAlt; varying vec3 vEixoV; varying vec3 vNObj; varying vec3 vPObj;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvAlt = dot(position, uEixo);\nvEixoV = normalize(normalMatrix * uEixo);\nvNObj = normal; vPObj = position;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uFreq; uniform float uAmp; varying float vAlt; varying vec3 vEixoV;\nuniform int uN; uniform vec3 uC0; uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uCentro; varying vec3 vNObj; varying vec3 vPObj;')

      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        float fase = vAlt * uFreq;
        float nitidez = clamp(1.0 - fwidth(fase) / 2.5, 0.0, 1.0);   // some quando longe (evita moiré)
        normal = normalize(normal + normalize(vEixoV) * sin(fase) * uAmp * nitidez);
        // filamentos multicoloridos: a cor depende do ângulo de visão (muda ao girar a peça)
        if (uN == 2) {
          // Duo Color Shadow: 70% cor principal + 30% escura — a escura vira sombra nas curvas e bordas
          float frente = abs(normal.z);
          float sombra = 1.0 - smoothstep(0.2, 0.85, frente);
          sombra = clamp(sombra * 0.85 + 0.12 * sin(vAlt * 0.09 + normal.x * 2.0), 0.0, 1.0);
          diffuseColor.rgb = mix(uC0, uC1, sombra);
        } else if (uN == 3) {
          // Tri Color: as 3 cores giram no fio — cada ângulo de visão revela um tom
          float t = clamp(normal.x * 0.75 + 0.5 + 0.28 * sin(vAlt * 0.08 + normal.y * 1.5), 0.0, 1.0);
          vec3 c = t < 0.5 ? mix(uC0, uC1, smoothstep(0.12, 0.45, t)) : mix(uC1, uC2, smoothstep(0.55, 0.88, t));
          diffuseColor.rgb = c;
        }`);
  };
  m.customProgramCacheKey = () => 'filamento';
  return m;
}
function pintar(m, cor) {
  const a = ACAB[cor.acab] || ACAB.premium;
  const base = new THREE.Color(cor.hex);
  m.color.copy(base);
  Object.assign(m, { roughness: a.roughness, metalness: a.metalness, clearcoat: a.clearcoat, clearcoatRoughness: a.clearcoatRoughness,
    sheen: a.sheen, sheenRoughness: a.sheenRoughness ?? 0.5, iridescence: a.iridescence, iridescenceIOR: a.iridescenceIOR ?? 1.3,
    transmission: 0, specularIntensity: cor.acab === 'velvet' ? 0.25 : 1 });
  // veludo: brilho das bordas um pouco mais claro que a cor; silk: reflexo puxado para a própria cor
  m.sheenColor.copy(base).lerp(new THREE.Color('#ffffff'), 0.12);
  m.specularColor.copy(cor.acab === 'silk' ? base.clone().lerp(new THREE.Color('#ffffff'), 0.5) : new THREE.Color('#ffffff'));
  m.userData.u.uAmp.value = a.camadas;
  const multi = cor.multi || [];
  m.userData.u.uN.value = multi.length > 1 ? multi.length : 1;
  multi.forEach((h, i) => m.userData.u['uC' + i].value.set(h));
  if (multi.length > 1) { m.sheenColor.set('#ffffff'); m.specularColor.set('#ffffff'); }
  m.needsUpdate = true;
}

/* ---------- estado ---------- */
let produto = null, grupo = null, zonaAtual = null, acabAtual = null, variacaoPendente = null;
const zonas = {};      // nomeZona -> { rotulo, cor, materiais: [] }
const loader = new GLTFLoader();
const cacheGLB = {};

function carregarProduto(p) {
  produto = p;
  $('sub').textContent = p.sub || '';
  [...$('modelos').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.id === p.id));
  $('load').classList.remove('oculto');
  const usar = gltf => {
    $('load').classList.add('oculto');
    montar(gltf.scene.clone(true), p);
  };
  if (cacheGLB[p.arquivo]) return usar(cacheGLB[p.arquivo]);
  const ok = g => { cacheGLB[p.arquivo] = g; if (produto === p) usar(g); };
  const erro = () => { $('load').textContent = 'Não foi possível carregar a peça.'; };
  if (p.arquivo.startsWith('data:')) {          // modelo embutido na página
    const bin = atob(p.arquivo.slice(p.arquivo.indexOf(',') + 1));
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    loader.parse(buf.buffer, '', ok, erro);
  } else loader.load(p.arquivo, ok, undefined, erro);
}

function montar(raiz, p) {
  if (grupo) cena.remove(grupo);
  for (const k in zonas) delete zonas[k];
  raiz.traverse(o => {
    if (!o.isMesh) return;
    const [zona, ax] = o.name.split('__');
    // eixo de impressão da parte: "x" = deitada de lado; padrão = vertical (no .glb, Y para cima)
    const eixo = ax === 'x' ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
    o.geometry.deleteAttribute('normal');
    o.geometry = toCreasedNormals(o.geometry, THREE.MathUtils.degToRad(35));
    o.material = criarMaterial(eixo);
    o.geometry.computeBoundingBox(); o.geometry.boundingBox.getCenter(o.material.userData.u.uCentro.value);
    const cfg = p.zonas[zona] || [zona, CONFIG.cores[0].nome];
    const chave = cfg[0];                       // partes com o mesmo rótulo = uma cor só
    zonas[chave] ??= { rotulo: cfg[0], cor: corPorNome(cfg[1]), materiais: [] };
    zonas[chave].materiais.push(o.material);
  });
  for (const z of Object.values(zonas)) z.materiais.forEach(m => pintar(m, z.cor));

  // enquadrar: maior dimensão = 1.3
  const caixa = new THREE.Box3().setFromObject(raiz), tam = caixa.getSize(new THREE.Vector3());
  const esc = 1.3 / Math.max(tam.x, tam.y, tam.z);
  grupo = new THREE.Group(); grupo.add(raiz); raiz.scale.setScalar(esc);
  const c = new THREE.Box3().setFromObject(raiz);
  raiz.position.set(-(c.min.x + c.max.x) / 2, -c.min.y, -(c.min.z + c.max.z) / 2);
  cena.add(grupo);
  sombra.scale.setScalar(Math.max(tam.x, tam.z) * esc * 1.7);
  $('medida').textContent = `${Math.round(tam.x)} × ${Math.round(tam.z)} × ${Math.round(tam.y)} mm`;
  enquadrar();

  // UI de zonas
  const nomes = Object.keys(zonas);
  $('blocoZonas').style.display = nomes.length > 1 ? '' : 'none';
  if (fixo) $('titulo').textContent = fixo.nome + (nomes.length > 1 ? ' — escolha as cores' : ' — escolha a cor');
  $('zonas').innerHTML = '';
  nomes.forEach(n => {
    const b = document.createElement('button'); b.dataset.z = n;
    b.innerHTML = `<span class="pt"></span>${zonas[n].rotulo}`;
    b.onclick = () => selZona(n);
    $('zonas').append(b);
  });
  selZona(nomes[0]);
  if (variacaoPendente) { const v = variacaoPendente; variacaoPendente = null; aplicarVariacoes(v); }
  if (parent !== window) parent.postMessage({ nika3dPronto: true }, '*');
}

function enquadrar() {
  // enquadra pela esfera que envolve a peça: cabe inteira em qualquer formato de peça
  if (!grupo) return;
  const caixa = new THREE.Box3().setFromObject(grupo), centro = caixa.getCenter(new THREE.Vector3());
  const raio = caixa.getSize(new THREE.Vector3()).length() / 2;
  const fov = THREE.MathUtils.degToRad(camera.fov), ajuste = Math.min(1, camera.aspect);
  const dist = raio / Math.sin(fov / 2) / ajuste * 1.12;
  controles.target.copy(centro);
  camera.position.copy(centro).add(new THREE.Vector3(2.3, 1.6, 3.1).normalize().multiplyScalar(dist));
  controles.update();
}

function selZona(n) {
  zonaAtual = n;
  [...$('zonas').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.z === n));
  $('rotCor').textContent = Object.keys(zonas).length > 1 ? `Cor — ${zonas[n].rotulo}` : 'Cor';
  mostrarAcab(zonas[n].cor.acab);
  atualizarResumo();
}

function mostrarAcab(k) {
  acabAtual = k;
  [...$('abas').children].forEach(b => b.setAttribute('aria-selected', b.dataset.k === k));
  $('descAcab').textContent = CONFIG.acabamentos[k].desc;
  $('cores').innerHTML = '';
  CONFIG.cores.filter(c => c.acab === k).forEach(c => {
    const b = document.createElement('button');
    b.className = 'nk-cor ' + c.acab; b.setAttribute('role', 'radio');
    b.style.backgroundColor = c.hex; b.title = c.nome;
    if (c.multi) b.style.backgroundImage = `conic-gradient(${c.multi.map((h, i) => `${h} ${i * 360 / c.multi.length}deg ${(i + 1) * 360 / c.multi.length}deg`).join(',')})`; b.setAttribute('aria-label', c.nome);
    b.setAttribute('aria-checked', zonas[zonaAtual]?.cor === c);
    b.onclick = () => escolher(c);
    $('cores').append(b);
  });
}

function escolher(c) {
  const z = zonas[zonaAtual]; z.cor = c;
  z.materiais.forEach(m => pintar(m, c));
  [...$('cores').children].forEach(b => b.setAttribute('aria-checked', b.title === c.nome));
  atualizarResumo();
}

function atualizarResumo() {
  [...$('zonas').children].forEach(b => b.querySelector('.pt').style.background = zonas[b.dataset.z].cor.hex);
  const linhas = Object.values(zonas).map(z =>
    `<div class="lin"><span class="pt" style="background:${z.cor.multi ? 'conic-gradient(' + z.cor.multi.join(',') + ')' : z.cor.hex}"></span><b>${z.rotulo}</b>${z.cor.nome} <span style="color:var(--nk-suave)">· ${CONFIG.acabamentos[z.cor.acab].rotulo}</span></div>`).join('');
  $('resumo').innerHTML = linhas + '<small>Ao comprar, informe essas cores na variação ou no campo de observações do pedido.</small>';
  const varias = Object.keys(zonas).length > 1;
  $('tag').innerHTML = Object.values(zonas).map(z => `<span><i style="background:${z.cor.multi ? 'conic-gradient(' + z.cor.multi.join(',') + ')' : z.cor.hex}"></i>${varias ? z.rotulo + ': ' : ''}${z.cor.nome}${sem(z.cor.nome).includes(sem(CONFIG.acabamentos[z.cor.acab].rotulo)) ? '' : ' · ' + CONFIG.acabamentos[z.cor.acab].rotulo}</span>`).join('');
  avisarAltura();
}

/* ---------- montar interface ---------- */
Object.keys(CONFIG.acabamentos).filter(k => CONFIG.cores.some(c => c.acab === k)).forEach(k => {
  const b = document.createElement('button'); b.setAttribute('role', 'tab');
  b.textContent = CONFIG.acabamentos[k].rotulo; b.dataset.k = k;
  b.onclick = () => mostrarAcab(k);
  $('abas').append(b);
});

const fixo = CONFIG.produtos.find(p => p.id === params.get('produto'));
const lista = fixo ? [fixo] : CONFIG.produtos;
lista.forEach(p => {
  const b = document.createElement('button'); b.textContent = p.nome; b.dataset.id = p.id;
  b.onclick = () => carregarProduto(p);
  $('modelos').append(b);
});
if (lista.length < 2) { $('blocoModelos').style.display = 'none'; $('titulo').textContent = fixo.nome + ' — escolha as cores'; }
carregarProduto(lista[0]);

$('btnGirar').onclick = () => { controles.autoRotate = !controles.autoRotate; $('btnGirar').setAttribute('aria-pressed', controles.autoRotate); };
$('btnCentro').onclick = () => enquadrar();
controles.addEventListener('start', () => { $('dica').style.opacity = 0; });

/* ---------- variação escolhida na loja → cor no modelo ---------- */
// a página do produto (ponte-loja.js) envia {nika3d:'variacao', opcoes:[{grupo, valor}]}
const LINHA_PALAVRAS = { duo: ['duo', 'shadow'], tri: ['tri color', 'tricolor', 'tri'], velvet: ['velvet', 'fosco', 'matte'], silk: ['silk', 'v silk', 'seda', 'metalico'], premium: ['premium', 'solida', 'solido'] };

function corDoTexto(valor) {
  const v = sem(valor);
  const linha = Object.keys(LINHA_PALAVRAS).find(k => LINHA_PALAVRAS[k].some(p => contem(v, p)));
  let achadas = CONFIG.cores.filter(c => contem(v, sem(c.nome)));
  if (linha) achadas = achadas.filter(c => c.acab === linha);          // linha no nome manda: sem cor dessa linha → usa o hex
  if (!achadas.length) return null;
  const tam = Math.max(...achadas.map(c => sem(c.nome).length));      // nome mais específico ("Rosa Bebê" > "Rosa")
  return achadas.find(c => sem(c.nome).length === tam);
}
function zonaDoTexto(txt) {
  const t = sem(txt);
  return Object.keys(zonas).find(z => contem(t, sem(zonas[z].rotulo)) || contem(t, sem(z))) || null;
}
function aplicarVariacoes(opcoes) {
  if (!Object.keys(zonas).length) { variacaoPendente = opcoes; return; }
  let ultima = null;
  for (const { grupo, valor, hex } of opcoes) {
    // cor da paleta (pelo nome) e/ou a cor exata cadastrada na variação da loja (hex)
    const daPaleta = corDoTexto(valor);
    const linha = Object.keys(LINHA_PALAVRAS).find(k => LINHA_PALAVRAS[k].some(p => contem(sem(valor), p)));
    if (!daPaleta && !hex) continue;
    // nome da tabela (ex.: "Rosa Bebê Velvet") → cor e efeito da linha; senão, a cor cadastrada na loja
    const cor = daPaleta ? { nome: valor, hex: daPaleta.hex, acab: daPaleta.acab, multi: daPaleta.multi }
                         : { nome: valor, hex, acab: linha || 'premium' };
    const z = zonaDoTexto(grupo) || zonaDoTexto(valor);
    const alvo = z ? [z] : Object.keys(zonas);                        // grupo "Cor" sem parte = peça inteira
    alvo.forEach(n => { zonas[n].cor = cor; zonas[n].materiais.forEach(m => pintar(m, cor)); });
    ultima = alvo[0];
  }
  if (ultima) selZona(ultima);
}
function modoLoja() {
  if (document.body.classList.contains('modo-loja')) return;
  document.body.classList.add('modo-loja');
  redimensionar();
  enquadrar();
}
if (params.get('modo') === 'loja') modoLoja();
window.addEventListener('message', e => {
  if (!e.data) return;
  if (e.data.nika3d === 'modo' && e.data.modo === 'loja') modoLoja();
  if (e.data.nika3d === 'variacao' && Array.isArray(e.data.opcoes)) aplicarVariacoes(e.data.opcoes);
});

/* ---------- tamanho / iframe ---------- */
function redimensionar() {
  const w = palco.clientWidth, h = palco.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  avisarAltura();
}
function avisarAltura() {   // informa a altura para a página da loja ajustar o iframe
  if (parent !== window) parent.postMessage({ nikatelie3d: document.documentElement.scrollHeight }, '*');
}
new ResizeObserver(redimensionar).observe(palco);
new ResizeObserver(avisarAltura).observe(document.body);
redimensionar();
renderer.setAnimationLoop(() => { controles.update(); renderer.render(cena, camera); });
</script>
</body>
