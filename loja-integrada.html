<!--

    caixa-agulhas | suporte-4-prateleiras | fita-metrica | bobinas

-->
<div class="nika3d">
  <iframe src="https://rrs747.github.io/nika/?produto=caixa-agulhas"

</div>

  .nika3d{width:100%;max-width:1000px;margin:16px auto}
  .nika3d iframe{width:100%;height:640px;border:0;display:block}
  @media (max-width:760px){ .nika3d iframe{height:1180px} }
</style>


<!--
  =====================================================================
  COMO NOMEAR AS VARIAÇÕES NO PRODUTO
  - Valor da variação = nome da cor como está no simulador, de preferência com a linha:
      "Azul", "Rosa Bebê Velvet", "Dourado Silk", "Branco Dental"
    (sem a linha, vale a primeira cor com esse nome: Premium > Velvet > V-Silk)
  - Peça de uma cor só: grupo "Cor" → pinta a peça inteira.
  - Peça com partes: coloque o nome da parte no grupo:
      Caixa de Agulhas ......... "Cor da Caixa", "Cor da Tampa", "Cor do Aplique"
      Suporte 4 Prateleiras .... "Cor das Laterais", "Cor das Prateleiras"
      Porta Fita Métrica ....... só "Cor" (peça de uma cor)
