<!--
  =====================================================================
  PASSO 2 — EM CADA PRODUTO 3D: descrição do produto (modo HTML / código-fonte)
  O script do passo 1 leva o modelo para o lugar da foto do produto.
  Troque o ?produto=... pela peça da página:
    caixa-agulhas | suporte-4-prateleiras | suporte-3-prateleiras | fita-metrica | bobinas | porta-canetinhas-80
  (para deixar o simulador completo na descrição, acrescente data-posicao="descricao" na div)
  (para exigir o nome antes de comprar, acrescente data-nome="obrigatorio" na div)
  =====================================================================
-->
<div class="nika3d"><iframe src="https://rrs747.github.io/nika/?produto=bobinas" title="Simulador 3D" scrolling="no" style="width:100%;aspect-ratio:1/1;border:0"></iframe></div>

<!--
  =====================================================================
  COMO NOMEAR AS VARIAÇÕES NO PRODUTO
  - Nome da variação igual ao da tabela de cores (com a linha) → o modelo usa a cor E o efeito:
      "Rosa Choque V-Silk"  → brilho perolado/metálico
      "Rosa Bebê Velvet"    → fosco aveludado
      "Azul" ou "Azul Premium" → liso com brilho leve (sem linha no nome = Premium)
      "Rosa com Preto Duo Shadow"            → duas cores, muda conforme o lado
      "Dourado / Rosa Choque / Verde Tri Color" → três cores em volta da peça
  - Outro nome (ex.: "Brilliant Rose") → usa a cor do quadradinho da variação, efeito Premium.
  - Sem nada marcado, mostra a 1ª opção.
  - Peça de uma cor só: grupo "Cor" → pinta a peça inteira.
  - Peça com partes: coloque o nome da parte no grupo:
      Caixa de Agulhas ......... "Cor da Caixa", "Cor da Tampa", "Cor do Aplique"
      Suporte 4 Prateleiras .... "Cor das Laterais", "Cor das Prateleiras"
      Suporte 3 Prateleiras .... "Cor das Laterais", "Cor das Prateleiras"
      Porta Canetinhas 80 ...... só "Cor" (peça de uma cor)
      Porta Fita Métrica ....... só "Cor" (peça de uma cor)
      Bobinas .................. só "Cor" (peça de uma cor)
  =====================================================================
-->
